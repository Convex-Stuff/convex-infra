services:
  atlantis:
    image: ghcr.io/runatlantis/atlantis:latest
    container_name: atlantis
    ports:
      - "4141:4141"
    environment:
      ATLANTIS_GH_APP_ID: ${ATLANTIS_GH_APP_ID}
      ATLANTIS_GH_APP_KEY: ${ATLANTIS_GH_APP_KEY}
      ATLANTIS_GH_WEBHOOK_SECRET: ${ATLANTIS_GH_WEBHOOK_SECRET}
      ATLANTIS_PORT: ${ATLANTIS_PORT}
      ATLANTIS_REPO_ALLOWLIST: ${ATLANTIS_REPO_ALLOWLIST}
    volumes:
      - atlantis-data:/home/atlantis/.atlantis
    restart: unless-stopped

volumes:
  atlantis-data:
