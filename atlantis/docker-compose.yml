services:
  atlantis:
    image: ghcr.io/runatlantis/atlantis:latest
    container_name: atlantis
    ports:
      - "4141:4141"
    environment:
      ATLANTIS_GH_APP_ID: ${ATLANTIS_GH_APP_ID}
      ATLANTIS_GH_APP_KEY: ${ATLANTIS_GH_APP_KEY}
      ATLANTIS_GH_WEBHOOK_SECRET: ${ATLANTIS_GH_WEBHOOK_SECRET}
      ATLANTIS_PORT: ${ATLANTIS_PORT}
      ATLANTIS_REPO_ALLOWLIST: ${ATLANTIS_REPO_ALLOWLIST}
      ATLANTIS_WRITE_GIT_CREDS: "true"
      TF_VAR_SERVER_USER: ${TF_VAR_SERVER_USER}
      TF_VAR_SERVER_HOST: ${TF_VAR_SERVER_HOST}
      TF_VAR_GF_SECURITY_ADMIN_USER: ${TF_VAR_GF_SECURITY_ADMIN_USER}
      TF_VAR_GF_SECURITY_ADMIN_PASSWORD: ${TF_VAR_GF_SECURITY_ADMIN_PASSWORD}
    dns:
      - 100.100.100.100
      - 8.8.8.8
    volumes:
      - atlantis-data:/home/atlantis/.atlantis
    restart: unless-stopped

volumes:
  atlantis-data:
