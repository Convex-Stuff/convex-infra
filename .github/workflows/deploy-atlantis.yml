name: Deploy Atlantis

# Atlantis runs on the terraform box, which only accepts SSH over the tailnet.
# The runner joins it as an ephemeral node, so DEPLOY_HOST must be the box's
# tailnet address or MagicDNS name.

on:
  push:
    branches:
      - main
    paths:
      - 'atlantis/**'
      - '.github/workflows/deploy-atlantis.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Required for the Tailscale action to request an OIDC token from GitHub.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Connect to tailnet
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          # Peer propagation is eventually consistent; wait until the box is
          # actually reachable rather than racing it in the next step.
          ping: ${{ secrets.DEPLOY_HOST }}

      # Temporary: diagnosing a host key fingerprint mismatch. Prints which
      # tailnet node DEPLOY_HOST is and the fingerprint of every host key it
      # offers. Fingerprints are public, so this is safe to log; one that
      # equals SSH_HOST_FINGERPRINT is masked by GitHub and shows as ***.
      - name: Show host keys
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ip=$(sudo tailscale ip -4 "$DEPLOY_HOST")
          echo "node: $(sudo tailscale whois --json "$ip" | jq -r '.Node.ComputedName // .Node.Name')"
          ssh-keyscan -T 10 "$DEPLOY_HOST" 2>/dev/null | ssh-keygen -lf -

      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          script: |
            cd ~/repos/convex-infra
            git pull origin main

            docker stop atlantis || true
            docker rm atlantis || true

            docker volume create atlantis_atlantis-data 2>/dev/null || true
            docker run --rm -v atlantis_atlantis-data:/data alpine chown -R 100:1000 /data

            ATLANTIS_GH_APP_ID=${{ vars.ATLANTIS_GH_APP_ID }} \
            ATLANTIS_GH_APP_KEY="${{ secrets.ATLANTIS_GH_APP_KEY }}" \
            ATLANTIS_GH_WEBHOOK_SECRET=${{ secrets.ATLANTIS_GH_WEBHOOK_SECRET }} \
            ATLANTIS_PORT=${{ vars.ATLANTIS_PORT }} \
            ATLANTIS_REPO_ALLOWLIST=${{ vars.ATLANTIS_REPO_ALLOWLIST }} \
            TF_VAR_SERVER_USER=${{ secrets.SERVER_USER }} \
            TF_VAR_SERVER_HOST=${{ secrets.SERVER_HOST }} \
            TF_VAR_GF_SECURITY_ADMIN_USER=${{ secrets.GF_SECURITY_ADMIN_USER }} \
            TF_VAR_GF_SECURITY_ADMIN_PASSWORD=${{ secrets.GF_SECURITY_ADMIN_PASSWORD }} \
            TF_VAR_TAILNET_IP=${{ vars.TAILNET_IP }} \
            docker compose -f atlantis/docker-compose.yml up -d
