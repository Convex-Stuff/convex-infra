name: Deploy Atlantis

on:
  push:
    branches:
      - master
    paths:
      - 'atlantis/**'
      - '.github/workflows/deploy-atlantis.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ~/repos/convex-infra
            git pull origin master

            docker stop atlantis || true
            docker rm atlantis || true

            docker volume create atlantis_atlantis-data 2>/dev/null || true
            docker run --rm -v atlantis_atlantis-data:/data alpine chown -R 100:1000 /data

            ATLANTIS_GH_APP_ID=${{ vars.ATLANTIS_GH_APP_ID }} \
            ATLANTIS_GH_APP_KEY="${{ secrets.ATLANTIS_GH_APP_KEY }}" \
            ATLANTIS_GH_WEBHOOK_SECRET=${{ secrets.ATLANTIS_GH_WEBHOOK_SECRET }} \
            ATLANTIS_PORT=${{ vars.ATLANTIS_PORT }} \
            ATLANTIS_REPO_ALLOWLIST=${{ vars.ATLANTIS_REPO_ALLOWLIST }} \
            TF_VAR_SERVER_USER=${{ secrets.SERVER_USER }} \
            TF_VAR_SERVER_HOST=${{ secrets.SERVER_HOST }} \
            TF_VAR_GF_SECURITY_ADMIN_USER=${{ secrets.GF_SECURITY_ADMIN_USER }} \
            TF_VAR_GF_SECURITY_ADMIN_PASSWORD=${{ secrets.GF_SECURITY_ADMIN_PASSWORD }} \
            docker compose -f atlantis/docker-compose.yml up -d
