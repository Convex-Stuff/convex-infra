name: Deploy Atlantis

on:
  push:
    branches:
      - master
    paths:
      - 'atlantis/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ~/repos/convex-infra
            git pull origin master

            docker stop atlantis || true
            docker rm atlantis || true

            ATLANTIS_GH_APP_ID=${{ vars.ATLANTIS_GH_APP_ID }} \
            ATLANTIS_GH_APP_KEY="${{ secrets.ATLANTIS_GH_APP_KEY }}" \
            ATLANTIS_GH_WEBHOOK_SECRET=${{ secrets.ATLANTIS_GH_WEBHOOK_SECRET }} \
            ATLANTIS_PORT=${{ vars.ATLANTIS_PORT }} \
            ATLANTIS_REPO_ALLOWLIST=${{ vars.ATLANTIS_REPO_ALLOWLIST }} \
            docker compose -f atlantis/docker-compose.yml up -d
