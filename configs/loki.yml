auth_enabled: false

server:
  http_listen_port: 3100
  http_server_read_timeout: 30s
  http_server_write_timeout: 30s

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 336h

  # Ceilings, not capacity planning: normal traffic here is a fraction of
  # these. They exist so one crash-looping container, or a public Faro
  # endpoint later, cannot fill the disk inside the retention window.
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8

  # A single noisy stream cannot consume the whole tenant budget.
  per_stream_rate_limit: 2MB
  per_stream_rate_limit_burst: 4MB

  # Cardinality guards. An app labelling by user id or request id would
  # otherwise blow up the index rather than the disk.
  max_global_streams_per_user: 5000
  max_label_names_per_series: 20

  # Truncate rather than drop, so an oversized line still says something.
  max_line_size: 256KB
  max_line_size_truncate: true

  # Reject backfill from a clock-skewed or replaying sender.
  reject_old_samples: true
  reject_old_samples_max_age: 168h

  max_query_series: 500

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
