# Alloy agent for the terraform box, which runs atlantis and the
# united-states-suiji website. Everything on jackserver is managed by the
# terraform in this repo; this box is not, so it gets a compose file instead.
#
#   CENTRAL_HOST=<jackserver tailnet address> docker compose up -d
#
# It creates the `observability` network. Apps on this box join that network
# (as external) and push telemetry to http://alloy:4318, exactly as containers
# on jackserver do — the agent forwards it across the tailnet.
name: alloy-agent

services:
  alloy:
    image: grafana/alloy:v1.17.1
    container_name: alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      CENTRAL_HOST: ${CENTRAL_HOST:?CENTRAL_HOST must be set to jackserver's tailnet address}
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    networks:
      - observability

networks:
  observability:
    name: observability

volumes:
  alloy-data:
